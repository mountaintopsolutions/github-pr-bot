name: Build and Push Docker Image

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Need write for creating releases and tags
      packages: write
      actions: read
      id-token: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for git tags
    
    - name: Configure Git
      run: |
        echo "Setting up git configuration..."
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Run build and push script
      id: build
      env:
        # Pin the published version. Remove this to go back to auto-incrementing the highest tag.
        # A '-suffix' marks it a pre-release: only this tag is published, and latest/vN/vN.M are
        # left pointing at the last stable build.
        VERSION: v1.0.12-dctest1
      run: |
        chmod +x scripts/build-and-push.sh
        scripts/build-and-push.sh


    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.build.outputs.new_version }}
        name: ${{ steps.build.outputs.new_version }}
        body: |
          ${{ github.event.pull_request.title || github.event.head_commit.message }}
          
          ## Docker Images
          ${{ steps.build.outputs.docker_tags }}

          ## Usage
          ```yaml
          uses: docker://${{ steps.build.outputs.image_name }}:${{ steps.build.outputs.new_version }}
          ```
        draft: false
        prerelease: ${{ steps.build.outputs.is_prerelease }} 